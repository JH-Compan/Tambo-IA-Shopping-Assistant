<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TamboBot — Selecciona tu usuario</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                tambo: { purple: '#4F1D7C', yellow: '#FFCC00', soft: '#F3EEF8' },
                wa:    { teal: '#008069', dark: '#111b21' }
            }
        }
    }
}
</script>
</head>

<body class="bg-[#0b141a] min-h-screen flex justify-center items-center p-4">

<div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

    <!-- HEADER -->
    <div class="bg-wa-teal px-6 py-5 text-white text-center">
        <div class="w-16 h-16 rounded-full bg-tambo-purple border-4 border-tambo-yellow flex items-center justify-center text-tambo-yellow font-bold text-2xl mx-auto mb-3">
            T+
        </div>
        <h1 class="text-xl font-bold">TamboBot IA</h1>
        <p class="text-sm text-green-100 mt-1">Selecciona tu usuario para comenzar</p>
    </div>

    <!-- CONTENIDO -->
    <div class="p-6">

        <!-- CARGANDO -->
        <div id="loading" class="text-center py-8 text-gray-500">
            <div class="animate-spin w-8 h-8 border-4 border-wa-teal border-t-transparent rounded-full mx-auto mb-3"></div>
            Cargando usuarios...
        </div>

        <!-- ERROR -->
        <div id="error" class="hidden text-center py-8">
            <p class="text-red-500 mb-4">No se pudo conectar al backend.</p>
            <p class="text-sm text-gray-500 mb-4">Verifica que Flask esté corriendo con:<br><code class="bg-gray-100 px-2 py-1 rounded">python app.py</code></p>
            <button onclick="cargarUsuarios()"
            class="bg-wa-teal text-white px-4 py-2 rounded-full text-sm hover:scale-105 transition">
                Reintentar
            </button>
        </div>

        <!-- LISTA DE USUARIOS -->
        <div id="lista-usuarios" class="hidden">
            <p class="text-sm text-gray-500 mb-4 text-center">¿Quién eres hoy?</p>
            <div id="usuarios-grid" class="grid grid-cols-2 gap-3 max-h-80 overflow-y-auto pr-1">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

    </div>
</div>

<script>
const API_BASE = "http://localhost:5000";

async function cargarUsuarios() {
    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("error").classList.add("hidden");
    document.getElementById("lista-usuarios").classList.add("hidden");

    try {
        const res = await fetch(`${API_BASE}/api/usuarios`);
        if (!res.ok) throw new Error("Error al cargar usuarios");
        const usuarios = await res.json();

        renderizarUsuarios(usuarios);
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("lista-usuarios").classList.remove("hidden");
    } catch (e) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("error").classList.remove("hidden");
    }
}

function renderizarUsuarios(usuarios) {
    const grid = document.getElementById("usuarios-grid");
    grid.innerHTML = "";

    const colores = [
        "bg-purple-100 border-purple-300 text-purple-800",
        "bg-teal-100 border-teal-300 text-teal-800",
        "bg-yellow-100 border-yellow-300 text-yellow-800",
        "bg-blue-100 border-blue-300 text-blue-800",
        "bg-pink-100 border-pink-300 text-pink-800",
        "bg-green-100 border-green-300 text-green-800",
    ];

    const segmentoEmoji = {
        "estudiante": "🎓",
        "trabajador": "💼",
        "hogar": "🏠",
    };

    usuarios.forEach((usuario, i) => {
        const color = colores[i % colores.length];
        const emoji = segmentoEmoji[usuario.segment] || "👤";
        const btn = document.createElement("button");
        btn.className = `border-2 rounded-xl p-3 text-left hover:scale-105 transition ${color}`;
        btn.innerHTML = `
            <div class="text-2xl mb-1">${emoji}</div>
            <div class="font-bold text-sm">${usuario.name_alias || usuario.user_code}</div>
            <div class="text-xs opacity-70">${usuario.user_code}</div>
            <div class="text-xs opacity-60 capitalize">${usuario.segment || ""}</div>
        `;
        btn.onclick = () => seleccionarUsuario(usuario);
        grid.appendChild(btn);
    });
}

async function seleccionarUsuario(usuario) {
    // Validar con el backend
    try {
        const res = await fetch(`${API_BASE}/api/usuarios/${usuario.user_code}`);
        const data = await res.json();

        if (!data.valido) {
            alert("Usuario no válido. Intenta con otro.");
            return;
        }

        // Guardar en sessionStorage y redirigir al chat
        sessionStorage.setItem("tambo_user_id",   usuario.user_code);
        sessionStorage.setItem("tambo_user_name", usuario.name_alias || usuario.user_code);
        sessionStorage.setItem("tambo_user_segment", usuario.segment || "");

        // Redirigir al chat
        window.location.href = "chat.html";

    } catch (e) {
        alert("Error al validar el usuario. Verifica el backend.");
    }
}

// Iniciar
cargarUsuarios();
</script>

</body>
</html>
