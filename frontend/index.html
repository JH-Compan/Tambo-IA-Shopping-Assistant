<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tambot + — Acceso</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        wa: {
          green: '#00a884',
          dark: '#0b141a',
          card: '#111b21',
          soft: '#202c33'
        }
      }
    }
  }
}
</script>

</head>

<body class="bg-wa-dark min-h-screen flex items-center justify-center p-4">

<!-- CARD PRINCIPAL -->
<div class="w-full max-w-sm bg-wa-card rounded-2xl shadow-xl overflow-hidden border border-white/5">

  <!-- HEADER -->
  <div class="bg-wa-green text-white text-center py-6">
    <div class="w-14 h-14 mx-auto bg-white text-wa-green font-bold text-xl rounded-full flex items-center justify-center mb-3">
      T+
    </div>
    <h1 class="text-lg font-semibold">Tambot +</h1>
    <p class="text-xs text-white/80">Asistente inteligente de compras</p>
  </div>

  <!-- TABS -->
  <div class="flex bg-wa-soft">
    <button id="tab-login"
      onclick="switchTab('login')"
      class="flex-1 py-3 text-sm font-semibold text-wa-green border-b-2 border-wa-green">
      Iniciar sesión
    </button>

    <button id="tab-registro"
      onclick="switchTab('registro')"
      class="flex-1 py-3 text-sm font-semibold text-white/60">
      Registrarse
    </button>
  </div>

  <!-- MENSAJES -->
  <div id="msg" class="hidden mx-4 mt-4 text-sm px-3 py-2 rounded-lg"></div>

  <!-- LOGIN -->
  <div id="panel-login" class="p-5">
    <input id="login-alias"
      placeholder="Usuario"
      class="w-full mb-3 px-4 py-3 rounded-lg bg-wa-soft text-white outline-none focus:ring-2 focus:ring-wa-green"/>

    <input id="login-pass"
      type="password"
      placeholder="Contraseña"
      class="w-full mb-5 px-4 py-3 rounded-lg bg-wa-soft text-white outline-none focus:ring-2 focus:ring-wa-green"/>

    <button onclick="login()"
      class="w-full bg-wa-green text-black font-semibold py-3 rounded-lg hover:opacity-90 transition">
      Entrar
    </button>

    <p class="text-xs text-center text-white/50 mt-4">
      ¿No tienes cuenta?
      <span onclick="switchTab('registro')" class="text-wa-green cursor-pointer font-semibold">
        Regístrate
      </span>
    </p>
  </div>

  <!-- REGISTRO -->
  <div id="panel-registro" class="p-5 hidden">

    <input id="reg-alias"
      placeholder="Nombre de usuario"
      class="w-full mb-3 px-4 py-3 rounded-lg bg-wa-soft text-white outline-none focus:ring-2 focus:ring-wa-green"/>

    <select id="reg-segment"
      class="w-full mb-5 px-4 py-3 rounded-lg bg-wa-soft text-white outline-none focus:ring-2 focus:ring-wa-green">
      <option value="">Selecciona segmento</option>
      <option value="estudiante">Estudiante</option>
      <option value="trabajador">Trabajador</option>
      <option value="hogar">Hogar</option>
      <option value="ahorrador">Ahorrador</option>
      <option value="snack">Snack lover</option>
    </select>

    <button onclick="registro()"
      class="w-full bg-wa-green text-black font-semibold py-3 rounded-lg hover:opacity-90 transition">
      Crear cuenta
    </button>

    <p class="text-xs text-center text-white/50 mt-4">
      ¿Ya tienes cuenta?
      <span onclick="switchTab('login')" class="text-wa-green cursor-pointer font-semibold">
        Inicia sesión
      </span>
    </p>
  </div>

</div>

<script>
const API_BASE = "http://localhost:5000";

/* TAB SWITCH */
function switchTab(tab) {
  hideMsg();

  document.getElementById("panel-login").classList.toggle("hidden", tab !== "login");
  document.getElementById("panel-registro").classList.toggle("hidden", tab !== "registro");

  document.getElementById("tab-login").className =
    `flex-1 py-3 text-sm font-semibold ${tab === "login" ? "text-wa-green border-b-2 border-wa-green" : "text-white/50"}`;

  document.getElementById("tab-registro").className =
    `flex-1 py-3 text-sm font-semibold ${tab === "registro" ? "text-wa-green border-b-2 border-wa-green" : "text-white/50"}`;
}

/* MSG */
function showMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent = text;

  el.className =
    "mx-4 mt-4 text-sm px-3 py-2 rounded-lg " +
    (type === "error"
      ? "bg-red-500/10 text-red-300 border border-red-500/30"
      : "bg-green-500/10 text-green-300 border border-green-500/30");

  el.classList.remove("hidden");
}

function hideMsg() {
  document.getElementById("msg").classList.add("hidden");
}

/* LOGIN */
async function login() {
  hideMsg();

  const name_alias = document.getElementById("login-alias").value.trim();
  const password   = document.getElementById("login-pass").value.trim();

  if (!name_alias || !password) {
    showMsg("Completa todos los campos", "error");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/usuarios/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name_alias, password })
    });

    const data = await res.json();

    if (data.valido) {
      sessionStorage.setItem("tambo_user_id", data.usuario.user_code);
      sessionStorage.setItem("tambo_user_name", data.usuario.name_alias);
      sessionStorage.setItem("tambo_user_segment", data.usuario.segment || "");

      window.location.href = "chat.html";
    } else {
      showMsg("Usuario o contraseña incorrectos", "error");
    }

  } catch (e) {
    showMsg("Error de conexión con el servidor", "error");
  }
}

/* REGISTRO */
async function registro() {
  hideMsg();

  const name_alias = document.getElementById("reg-alias").value.trim();
  const segment    = document.getElementById("reg-segment").value;

  if (!name_alias || !segment) {
    showMsg("Completa todos los campos", "error");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/usuarios/registro`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name_alias, segment })
    });

    const data = await res.json();

    if (res.ok && data.success) {
      showMsg("Cuenta creada correctamente", "success");

      setTimeout(() => {
        switchTab("login");
        document.getElementById("login-alias").value = name_alias;
        document.getElementById("login-pass").value = data.usuario.user_code;
      }, 1200);

    } else {
      showMsg("Error al registrar", "error");
    }

  } catch (e) {
    showMsg("Error de conexión", "error");
  }
}
</script>

</body>
</html>
