name: Security Analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/unificar-dashboard-recomendaciones
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
          queries: security-extended,security-and-quality

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python-javascript"

  python-security:
    name: Python dependency, SAST and secret scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[toml]" pip-audit detect-secrets

      - name: Prepare report directory
        run: mkdir -p reports/security

      - name: Run Bandit SAST scan
        run: |
          bandit -r python -f json -o reports/security/bandit.json --exit-zero
          bandit -r python -f txt -o reports/security/bandit.txt --exit-zero

      - name: Run pip-audit dependency scan
        run: |
          set +e
          pip-audit -r python/requirements.txt --format json --output reports/security/pip-audit.json
          status=$?
          echo "pip-audit exit code: ${status}" > reports/security/pip-audit.txt
          if [ ! -s reports/security/pip-audit.json ]; then
            echo '{"dependencies":[]}' > reports/security/pip-audit.json
          fi
          exit 0

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan \
            --all-files \
            --exclude-files '(^|/)(\.git|reports/security)/' \
            > reports/security/detect-secrets.json

      - name: Build security summary
        run: python scripts/security_summary.py reports/security

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-analysis-reports
          path: reports/security
          if-no-files-found: error
