
<!DOCTYPE html>

tailwind.config = {

<style>
body{
    font-family: Arial, sans-serif;
}

.wa-bg{

<body class="bg-[#0b141a] h-screen flex justify-center items-center overflow-hidden">

<div class="w-full max-w-md h-full md:h-[95%] md:rounded-2xl overflow-hidden shadow-2xl bg-white flex flex-col">

    <!-- HEADER -->
    <header class="bg-wa-teal text-white px-4 py-3 flex items-center justify-between">

        <div class="flex items-center gap-3">

            <div class="w-11 h-11 rounded-full bg-tambo-purple flex items-center justify-center border-2 border-tambo-yellow font-bold text-tambo-yellow">
                T+
            </div>

            <div>
                <h2 class="font-bold">Tambo+</h2>
                <p id="bot-status" class="text-xs text-green-100">
                    en línea
                </p>
            </div>

        </div>

        <div class="flex items-center gap-4">

            <button onclick="resetAll()"
            class="text-xs bg-[#0b5c4b] px-3 py-1 rounded-lg font-bold hover:scale-105 transition">
                Reiniciar
            </button>

            <i class="fa-solid fa-ellipsis-vertical"></i>

        </div>

    </header>

    <!-- CHAT -->
    <main id="chat-box"
    class="flex-1 overflow-y-auto p-4 wa-bg bg-wa-bg flex flex-col gap-3 no-scrollbar">

        <div class="self-center bg-[#fff3c4] text-[#6b5b22] text-[11px] px-3 py-2 rounded-lg text-center shadow">
            Simulación IA Tambo+ Producción — recomendaciones inteligentes y carrito dinámico.
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#f0f2f5] p-3 flex items-center gap-2 border-t">

        <input
            id="chat-input"
            type="text"
            placeholder="Escribe un mensaje..."
            class="flex-1 rounded-full px-4 py-2 text-sm outline-none border"
            onkeypress="handleKey(event)"
        />

        <button onclick="processMessage()"
        class="bg-wa-teal text-white w-11 h-11 rounded-full hover:scale-105 transition">
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </footer>

</div>

<script>

/* =========================================================
   BASE DE DATOS COMPLETA
========================================================= */

const PRODUCTS = [

/* BEBIDAS */

{
    id:"B1",
    nombre:"Inca Kola 500ml",
    precio:3.50,
    categoria:"bebidas",
    keywords:["inca","gaseosa","cola"],
    stock:25
},
{
    id:"B2",
    nombre:"Coca Cola 500ml",
    precio:3.50,
    categoria:"bebidas",
    keywords:["coca","cola"],
    stock:20
},
{
    id:"B3",
    nombre:"Sprite 500ml",
    precio:3.50,
    categoria:"bebidas",
    keywords:["sprite"],
    stock:15
},
{
    id:"B4",
    nombre:"Agua San Luis",
    precio:2.00,
    categoria:"bebidas",
    keywords:["agua"],
    stock:40
},
{
    id:"B5",
    nombre:"Red Bull",
    precio:8.50,
    categoria:"bebidas",
    keywords:["energizante","redbull"],
    stock:10
},
{
    id:"B6",
    nombre:"Pilsen Lata",
    precio:5.00,
    categoria:"bebidas",
    keywords:["cerveza","pilsen"],
    stock:18
},

/* SNACKS */

{
    id:"S1",
    nombre:"Papas Lays",
    precio:2.80,
    categoria:"snacks",
    keywords:["lays","papas"],
    stock:30
},
{
    id:"S2",
    nombre:"Doritos",
    precio:3.50,
    categoria:"snacks",
    keywords:["doritos"],
    stock:22
},
{
    id:"S3",
    nombre:"Oreo Familiar",
    precio:3.20,
    categoria:"snacks",
    keywords:["oreo","galleta"],
    stock:14
},
{
    id:"S4",
    nombre:"Chocolate Sublime",
    precio:2.50,
    categoria:"snacks",
    keywords:["sublime","chocolate"],
    stock:35
},
{
    id:"S5",
    nombre:"Pícaras",
    precio:1.80,
    categoria:"snacks",
    keywords:["picaras"],
    stock:20
},

/* COMIDA */

{
    id:"C1",
    nombre:"Empanada de Carne",
    precio:4.90,
    categoria:"comida",
    keywords:["empanada"],
    stock:15
},
{
    id:"C2",
    nombre:"Pizza Pepperoni",
    precio:16.90,
    categoria:"comida",
    keywords:["pizza"],
    stock:9
},
{
    id:"C3",
    nombre:"Hot Dog",
    precio:5.50,
    categoria:"comida",
    keywords:["hotdog","salchicha"],
    stock:13
},
{
    id:"C4",
    nombre:"Hamburguesa Clásica",
    precio:12.90,
    categoria:"comida",
    keywords:["hamburguesa"],
    stock:8
},
{
    id:"C5",
    nombre:"Combo Broaster",
    precio:18.90,
    categoria:"comida",
    keywords:["pollo","broaster"],
    stock:7
}

];

/* =========================================================
   VARIABLES
========================================================= */

let cart = [];
let purchaseHistory = [];

/* =========================================================
   PROMOCIONES
========================================================= */

const PROMOS = [

{
    id:"P1",
    nombre:"Combo Pizza + Coca Cola",
    productos:[
        "Pizza Pepperoni",
        "Coca Cola 500ml"
    ],
    precio:19.90
},

{
    id:"P2",
    nombre:"Combo Dulcero",
    productos:[
        "Chocolate Sublime",
        "Chocolate Sublime",
        "Chocolate Sublime",
        "Pícaras",
        "Pícaras"
    ],
    precio:8.00
},

{
    id:"P3",
    nombre:"Combo Previa",
    productos:[
        "Pilsen Lata",
        "Pilsen Lata",
        "Pilsen Lata",
        "Pilsen Lata",
        "Pilsen Lata",
        "Pilsen Lata"
    ],
    precio:24.90
}

];

/* =========================================================
   INIT
========================================================= */

window.onload = () => {

    botMessage(`
        ¡Hola! Bienvenido a <strong>Tambo+</strong><br><br>

        Soy <strong>TamboBot IA</strong>, tu asistente inteligente.<br><br>

        Puedo:
        <br>• Mostrar productos
        <br>• Crear combos
        <br>• Recomendar según tus gustos
        <br>• Gestionar carrito
        <br>• Generar ticket automático
        <br><br>

        ¿Qué deseas hoy?
    `,[
        "Ver bebidas",
        "Ver snacks",
        "Ver comida",
        "Ver promociones",
        "Mi recomendación IA"
    ]);

}

/* =========================================================
   INPUT
========================================================= */

function handleKey(e){

    if(e.key === "Enter"){
        processMessage();
    }

}

function processMessage(){

    const input = document.getElementById("chat-input");

    const text = input.value.trim();

    if(!text) return;

    userMessage(text);

    input.value = "";

    setStatus("procesando IA...");

    setTimeout(()=>{

        chatbot(text);

        setStatus("en línea");

    },700);

}

/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    document.getElementById("bot-status").innerText = text;

}

/* =========================================================
   CHATBOT ENGINE
========================================================= */

function chatbot(message){

    const q = normalize(message);

    /* ======================================
       CARRITO
    ====================================== */

    if(
        q.includes("carrito") ||
        q.includes("ver compra")
    ){

        showCart();
        return;

    }

    /* ======================================
       FINALIZAR
    ====================================== */

    if(
        q.includes("finalizar") ||
        q.includes("cerrar compra") ||
        q.includes("pagar")
    ){

        finishPurchase();
        return;

    }

    /* ======================================
       BEBIDAS
    ====================================== */

    if(q.includes("bebida")){

        showCategory("bebidas","🥤 Bebidas Disponibles");
        return;

    }

    /* ======================================
       SNACKS
    ====================================== */

    if(
        q.includes("snack") ||
        q.includes("dulce")
    ){

        showCategory("snacks","Snacks y Dulces");
        return;

    }

    /* ======================================
       COMIDA
    ====================================== */

    if(q.includes("comida")){

        showCategory("comida","Comida Lista");
        return;

    }

    /* ======================================
       PROMOS
    ====================================== */

    if(q.includes("promo")){

        showPromos();
        return;

    }

    /* ======================================
       RECOMENDACION IA
    ====================================== */

    if(
    q.includes("recomendacion") ||
    q.includes("recomiendame") ||
    q === "ia"
){

        generateRecommendation();
        return;

    }

    /* ======================================
       COMPRAR COMBOS
    ====================================== */

    if(
        q.includes("combo pizza")
    ){

        addPromoToCart("P1");
        return;

    }

    if(
        q.includes("combo dulcero")
    ){

        addPromoToCart("P2");
        return;

    }

    if(
        q.includes("combo previa")
    ){

        addPromoToCart("P3");
        return;

    }

    /* ======================================
       AGREGAR PRODUCTOS
    ====================================== */

    if(
        q.includes("comprar") ||
        q.includes("agregar")
    ){

        addToCart(q);
        return;

    }

    /* ======================================
       SALUDO
    ====================================== */

    if(
        q.includes("hola") ||
        q.includes("buenas")
    ){

        botMessage(`
            ¡Hola nuevamente!<br><br>

            Puedes explorar:
        `,[
            "Ver bebidas",
            "Ver snacks",
            "Ver comida",
            "Ver promociones",
            "Mi recomendación IA"
        ]);

        return;

    }

    /* ======================================
       DEFAULT
    ====================================== */

    botMessage(`
        No entendí exactamente tu solicitud<br><br>

        Puedes probar:
        <br>• bebidas
        <br>• snacks
        <br>• comida
        <br>• promociones
        <br>• recomendación
        <br>• carrito
    `);

}

/* =========================================================
   MOSTRAR CATEGORIAS
========================================================= */

function showCategory(category,title){

    const products = PRODUCTS.filter(
        p=>p.categoria===category
    );

    let html = `<strong>${title}</strong><br><br>`;

    products.forEach(p=>{

        html += `
            • <strong>${p.nombre}</strong><br>
            Precio: S/ ${p.precio.toFixed(2)}<br>
            Stock: ${p.stock}<br><br>
        `;

    });

    botMessage(
        html,
        products.map(p=>"Comprar "+p.nombre)
    );

}

/* =========================================================
   AGREGAR PRODUCTOS
========================================================= */

function addToCart(query){

    let found = null;

    PRODUCTS.forEach(p=>{

        p.keywords.forEach(k=>{

            if(query.includes(k)){
                found = p;
            }

        });

        if(
            query.includes(normalize(p.nombre))
        ){
            found = p;
        }

    });

    if(!found){

        botMessage(`
            No encontré ese producto.
        `);

        return;

    }

    if(found.stock <= 0){

        botMessage(`
            ${found.nombre} no tiene stock.
        `);

        return;

    }

    found.stock--;

    cart.push({
        ...found,
        isPromo:false
    });

    purchaseHistory.push(found);

    const total = calculateTotal();

    botMessage(`
        <strong>${found.nombre}</strong> agregado al carrito.<br><br>

        Productos actuales: ${cart.length}<br>
        Total parcial: S/ ${total.toFixed(2)}
    `,[
        "Ver carrito",
        "Finalizar compra",
        "Mi recomendación IA",
        "Ver promociones"
    ]);

}

/* =========================================================
   AGREGAR PROMOS
========================================================= */

function addPromoToCart(promoId){

    const promo = PROMOS.find(
        p=>p.id===promoId
    );

    if(!promo){

        botMessage(`
            Promoción no encontrada.
        `);

        return;

    }

    let productosHTML = "";

    promo.productos.forEach(nombre=>{

        const product = PRODUCTS.find(
            p=>p.nombre===nombre
        );

        if(product){

            cart.push({
                ...product,
                isPromo:true,
                promoName:promo.nombre,
                promoPrice:promo.precio
            });

            productosHTML += `
                • ${product.nombre}<br>
            `;

        }

    });

    const total = calculateTotal();

    botMessage(`
        <strong>${promo.nombre}</strong> agregado al carrito.<br><br>

        <strong>Incluye:</strong><br>
        ${productosHTML}<br>

        Precio promocional:
        <strong>S/ ${promo.precio.toFixed(2)}</strong><br><br>

        Total actual:
        <strong>S/ ${total.toFixed(2)}</strong>
    `,[
        "Ver carrito",
        "Finalizar compra",
        "Mi recomendación IA"
    ]);

}

/* =========================================================
   CARRITO
========================================================= */

function showCart(){

    if(cart.length===0){

        botMessage(`
            Tu carrito está vacío.
        `);

        return;

    }

    let html = `
        <strong>🛒 Tu carrito actual</strong><br><br>
    `;

    cart.forEach((p,i)=>{

        html += `
            ${i+1}. ${p.nombre}
        `;

        if(p.isPromo){

            html += `
                <br>
                <span style="color:#7c3aed;font-weight:bold;">
                    ${p.promoName}
                </span>
            `;

        }

        html += `
            <br>
        `;

        if(p.isPromo){

            html += `
                Precio incluido en promoción
            `;

        }else{

            html += `
                S/ ${p.precio.toFixed(2)}
            `;

        }

        html += `<br><br>`;

    });

    html += `
        <strong>Total:</strong>
        S/ ${calculateTotal().toFixed(2)}
    `;

    botMessage(html,[
        "Finalizar compra",
        "Ver promociones",
        "Mi recomendación IA"
    ]);

}

/* =========================================================
   TOTAL REAL
========================================================= */

function calculateTotal(){

    let total = 0;

    const promosAdded = [];

    cart.forEach(item=>{

        if(item.isPromo){

            if(
                !promosAdded.includes(item.promoName)
            ){

                total += item.promoPrice;

                promosAdded.push(item.promoName);

            }

        }else{

            total += item.precio;

        }

    });

    return total;

}

/* =========================================================
   RECOMENDACIONES IA
========================================================= */

function generateRecommendation(){

    if(cart.length===0){

        botMessage(`
            Aún no compras nada.<br><br>

            Te recomendamos:
            <br>• Empanada + Inca Kola
            <br>• Pizza + Coca Cola
            <br>• Oreo + Red Bull
        `,[
            "Comprar Combo Pizza",
            "Comprar Inca Kola",
            "Comprar Oreo Familiar"
        ]);

        return;

    }

    const last = cart[cart.length-1];

    /* BEBIDAS */

    if(last.categoria==="bebidas"){

        botMessage(`
            Detectamos interés en bebidas.<br><br>

            Recomendación IA:
            <br><br>

            Coca Cola
            <br>
            Oreo Familiar
            <br><br>

            Perfecto para acompañar tu bebida
        `,[
            "Comprar Coca Cola",
            "Comprar Oreo Familiar"
        ]);

        return;

    }

    /* SNACKS */

    if(last.categoria==="snacks"){

        botMessage(`
            Vemos que te gustan los snacks<br><br>

            También podrían gustarte:
            <br><br>

            Chocolate Sublime
            <br>
            Red Bull
        `,[
            "Comprar Chocolate Sublime",
            "Comprar Red Bull"
        ]);

        return;

    }

    /* COMIDA */

    if(last.categoria==="comida"){

        botMessage(`
            Recomendación para acompañar tu comida:<br><br>

            Inca Kola helada
            <br>
            Papas Lays
        `,[
            "Comprar Inca Kola",
            "Comprar Papas Lays"
        ]);

        return;

    }

}

/* =========================================================
   PROMOCIONES
========================================================= */

function showPromos(){

    let html = `
        <strong>Promociones del Día</strong><br><br>
    `;

    PROMOS.forEach(promo=>{

        html += `
            • <strong>${promo.nombre}</strong><br>
            Incluye:<br>
            ${promo.productos.join(", ")}<br>
            <strong>S/ ${promo.precio.toFixed(2)}</strong><br><br>
        `;

    });

    botMessage(html,[
        "Comprar Combo Pizza",
        "Comprar Combo Dulcero",
        "Comprar Combo Previa"
    ]);

}

/* =========================================================
   FINALIZAR
========================================================= */

function finishPurchase(){

    if(cart.length===0){

        botMessage(`
            No tienes productos en el carrito.
        `);

        return;

    }

    let ticket = `
        <strong>TICKET DIGITAL TAMBO+</strong><br><br>
    `;

    cart.forEach((p,i)=>{

        ticket += `
            ${i+1}. ${p.nombre}
        `;

        if(p.isPromo){

            ticket += `
                <br>
                <span style="color:#7c3aed;">
                    ${p.promoName}
                </span>
            `;

        }

        ticket += `<br><br>`;

    });

    const code = "TB-"+Math.floor(Math.random()*90000);

    ticket += `
        --------------------------------<br>

        <strong>Total:</strong>
        S/ ${calculateTotal().toFixed(2)}<br><br>

        Código de recojo:<br>
        <strong>${code}</strong><br><br>

        Gracias por comprar en Tambo+
    `;

    botMessage(ticket,[
        "Ver bebidas",
        "Ver snacks",
        "Ver promociones"
    ]);

    cart = [];

}

/* =========================================================
   UI MENSAJES
========================================================= */

function userMessage(text){

    appendBubble(text,true);

}

function botMessage(text,buttons=[]){

    appendBubble(text,false,buttons);

}

function appendBubble(text,isUser,buttons=[]){

    const chat = document.getElementById("chat-box");

    const div = document.createElement("div");

    div.className = `
        max-w-[85%]
        p-3
        rounded-xl
        shadow
        text-sm
        ${isUser
            ? 'self-end bg-wa-out rounded-br-none'
            : 'self-start bg-wa-in rounded-bl-none'}
    `;

    let html = `
        <div class="leading-relaxed text-gray-800">
            ${text}
        </div>
    `;

    if(buttons.length>0 && !isUser){

        html += `
            <div class="mt-3 border-t pt-3 flex flex-col gap-2">
        `;

        buttons.forEach(btn=>{

            html += `
                <button
                onclick="quick('${btn}')"
                class="bg-gray-100 hover:bg-gray-200 transition rounded-lg py-2 px-3 text-xs font-bold text-purple-900">
                    ${btn}
                </button>
            `;

        });

        html += `</div>`;

    }

    html += `
        <div class="text-[10px] text-right text-gray-400 mt-2">
            ${timeNow()}
        </div>
    `;

    div.innerHTML = html;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}

function quick(text){

    document.getElementById("chat-input").value = text;

    processMessage();

}

/* =========================================================
   HELPERS
========================================================= */

function normalize(text){

    return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");

}

function timeNow(){

    return new Date().toLocaleTimeString([],{
        hour:'2-digit',
        minute:'2-digit'
    });

}

/* =========================================================
   RESET
========================================================= */

function resetAll(){

    cart = [];
    purchaseHistory = [];

    const chat = document.getElementById("chat-box");

    chat.innerHTML = "";

    window.onload();

}

</script>
</body>
</html>
